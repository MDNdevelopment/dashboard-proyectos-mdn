name: Mutation testing

# No bloquea PRs (Stryker corre la suite N veces por mutante — demasiado lento para
# cada push). Corre semanalmente sobre la lógica pura de alto riesgo en stryker.conf.json
# (permisos, SLA, progreso, scoring) y queda disponible manualmente. Ver docs/QA_BLINDAJE.md 2.2.
on:
  schedule:
    - cron: '0 6 * * 1' # lunes 06:00 UTC
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
