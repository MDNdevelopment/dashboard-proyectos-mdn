[build]
  command = "npm test && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/projects"
  to = "/.netlify/functions/projects"
  status = 200
  force = true

[[redirects]]
  from = "/api/projects/*"
  to = "/.netlify/functions/projects"
  status = 200
  force = true

[[redirects]]
  from = "/api/employees"
  to = "/.netlify/functions/create-employee"
  status = 200
  force = true

[[redirects]]
  from = "/api/evaluation-analysis"
  to = "/.netlify/functions/evaluation-analysis"
  status = 200
  force = true

[[redirects]]
  from = "/api/ceo-analysis"
  to = "/.netlify/functions/ceo-analysis"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai-chat"
  to = "/.netlify/functions/ai-chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/employees/manage"
  to = "/.netlify/functions/archive-employee"
  status = 200
  force = true

[[redirects]]
  from = "/api/employees/update"
  to = "/.netlify/functions/update-employee"
  status = 200
  force = true

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/oauth"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource/mcp"
  to = "/.netlify/functions/oauth"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "/.netlify/functions/oauth"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/*"
  to = "/.netlify/functions/oauth"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
